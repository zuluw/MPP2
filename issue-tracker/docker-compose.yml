services:
  server:
    build: ./server
    container_name: issue_tracker_server
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
    environment:
      - PORT=5000
    restart: unless-stopped

  client:
    build: ./client
    container_name: issue_tracker_client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped